<VirtualHost  APACHE_IP_PORT >
    ServerName localhost
	
    Alias /jsbach APACHE_RUTA_CGI_BIN

    <Directory "APACHE_RUTA_CGI_BIN">        
        AllowOverride None
        Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
        AddHandler cgi-script .cgi
        Require all granted
    </Directory>
    
    ErrorLog ${APACHE_LOG_DIR}/error_jsbach.log
    CustomLog ${APACHE_LOG_DIR}/access_jsbach.log combined
</VirtualHost>
